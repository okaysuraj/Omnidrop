services:
  db:
    image: postgres:18-alpine
    container_name: omnidrop_postgres
    environment:
      POSTGRES_USER: omnidrop
      POSTGRES_PASSWORD: omnidrop_secret
      POSTGRES_DB: omnidrop_db
    ports:
      - "5433:5432"
    volumes:
      - omnidrop_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnidrop -d omnidrop_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  omnidrop_pg_data:
